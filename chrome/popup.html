<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Created by SeihyouMirai -->
  <meta charset="UTF-8">
  <title>Discord Badges Customize Tool</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border-bottom: 1px solid #35363c;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #badgeList {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #enabledBadgeOrder {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 14px;
      padding: 10px;
      min-height: 34px;
      background: #232428;
      border: 1px solid #35363c;
      border-radius: 8px;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #2b2d31;
      border-radius: 6px;
      cursor: grab;
    }

    .order-badge img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; }
    .order-badge.dragging { opacity: .45; }
    .order-badge:active { cursor: grabbing; }

    .badge-section + .badge-section {
      margin-top: 14px;
    }

    .badge-section h2 {
      margin: 0 0 8px;
      padding: 0 4px;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
    }

    #badgeList::-webkit-scrollbar {
      width: 6px;
    }
    #badgeList::-webkit-scrollbar-track {
      background: #1e1f22;
    }
    #badgeList::-webkit-scrollbar-thumb {
      background: #2b2d31;
      border-radius: 4px;
    }
    #badgeList::-webkit-scrollbar-thumb:hover {
      background: #4e5058;
    }

    .badge-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background-color: #2b2d31;
      border-radius: 8px;
      cursor: grab;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .badge-item.dragging {
      opacity: 0.5;
    }

    .badge-item:hover {
      background-color: #35363c;
    }

    .badge-item:active {
      cursor: grabbing;
      transform: scale(0.99);
    }

    .badge-item img {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      border-radius: 4px;
      object-fit: contain;
      pointer-events: none;
    }

    .badge-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #dbdee1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #80848e;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23a55a;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; font-size:13px; }
    #languageSelect { max-width:130px; padding:5px 7px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
  </style>
</head>
<body>
  <h1 data-i18n="settings">設定</h1>
  <div class="settings-row"><span data-i18n="language">言語</span><select id="languageSelect" aria-label="Language">
    <option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option>
  </select></div>
  <div class="settings-row"><span data-i18n="staffMode">スタッフモード</span><label class="switch"><input id="staffModeToggle" type="checkbox" checked><span class="slider"></span></label></div>
  <div class="settings-row"><span data-i18n="override">バッジを上書き</span><label class="switch"><input id="overrideToggle" type="checkbox" checked><span class="slider"></span></label></div>
  <div id="enabledBadgeOrder" aria-label="有効なバッジの表示順" title="ドラッグして表示順を変更"></div>
  <div id="badgeList"></div>
  <script src="popup.js"></script>
  <p data-i18n="credit">Made by 清冰みらい</p>
</body>
</html>
