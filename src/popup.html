<!DOCTYPE html>
<html lang="ja">
<head>
  <!-- Created by SeihyouMirai -->
  <meta charset="UTF-8">
  <title>Discord Profile Customize Tool</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      padding: 16px;
      background-color: #1e1f22;
      color: #f2f3f5;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      box-sizing: border-box;
    }

    h1 {
      margin: 0 0 16px 0;
      font-size: 16px;
      font-weight: 600;
      color: #fff;
      border-bottom: 1px solid #35363c;
      padding-bottom: 8px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    #badgeList {
      max-height: 360px;
      overflow-y: auto;
      padding-right: 4px;
    }

    #enabledBadgeOrder {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 0 0 14px;
      padding: 10px;
      min-height: 34px;
      background: #232428;
      border: 1px solid #35363c;
      border-radius: 8px;
    }

    .order-badge {
      width: 34px;
      height: 34px;
      display: grid;
      place-items: center;
      background: #2b2d31;
      border-radius: 6px;
      cursor: grab;
    }

    .order-badge img { width: 24px; height: 24px; object-fit: contain; pointer-events: none; }
    .order-badge.dragging { opacity: .45; }
    .order-badge:active { cursor: grabbing; }

    .badge-section + .badge-section {
      margin-top: 14px;
    }

    .badge-section h2 {
      margin: 0 0 8px;
      padding: 0 4px;
      color: #b5bac1;
      font-size: 12px;
      font-weight: 600;
    }

    #badgeList::-webkit-scrollbar {
      width: 6px;
    }
    #badgeList::-webkit-scrollbar-track {
      background: #1e1f22;
    }
    #badgeList::-webkit-scrollbar-thumb {
      background: #2b2d31;
      border-radius: 4px;
    }
    #badgeList::-webkit-scrollbar-thumb:hover {
      background: #4e5058;
    }

    .badge-item {
      display: flex;
      align-items: center;
      padding: 8px 12px;
      margin-bottom: 6px;
      background-color: #2b2d31;
      border-radius: 8px;
      cursor: grab;
      user-select: none;
      transition: background-color 0.2s, transform 0.1s;
    }

    .badge-item.dragging {
      opacity: 0.5;
    }

    .badge-item:hover {
      background-color: #35363c;
    }

    .badge-item:active {
      cursor: grabbing;
      transform: scale(0.99);
    }

    .badge-item img {
      width: 22px;
      height: 22px;
      margin-right: 12px;
      border-radius: 4px;
      object-fit: contain;
      pointer-events: none;
    }

    .badge-text {
      flex: 1;
      font-size: 13px;
      font-weight: 500;
      color: #dbdee1;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      pointer-events: none;
    }

    .switch {
      position: relative;
      display: inline-block;
      width: 36px;
      height: 20px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #80848e;
      transition: .2s;
      border-radius: 20px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 14px;
      width: 14px;
      left: 3px;
      bottom: 3px;
      background-color: white;
      transition: .2s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: #23a55a;
    }

    input:checked + .slider:before {
      transform: translateX(16px);
    }

    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 12px; font-size:13px; }
    #languageSelect { max-width:130px; padding:5px 7px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    .server-tag-settings { display:grid; gap:8px; margin:0 0 14px; }
    .server-tag-settings > label { display:grid; gap:5px; color:#b5bac1; font-size:12px; }
    .server-tag-settings select, .server-tag-settings input { width:100%; box-sizing:border-box; padding:7px 8px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    #categorySelect, .profile-settings input, .profile-settings textarea { width:100%; box-sizing:border-box; padding:7px 8px; color:#f2f3f5; background:#2b2d31; border:1px solid #4e5058; border-radius:5px; }
    #categorySelect { margin-bottom:14px; }
    .settings-panel[hidden] { display:none; }
    .settings-panel { max-height:470px; overflow-y:auto; padding-right:4px; }
    .profile-settings { display:grid; gap:8px; }
    .profile-settings > label { display:grid; gap:5px; color:#b5bac1; font-size:12px; }
    .profile-settings textarea { min-height:90px; resize:vertical; font:inherit; }
  </style>
</head>
<body>
  <h1 data-i18n="settings">設定</h1>
  <select id="categorySelect" aria-label="Settings category">
    <option value="general" data-i18n="categoryGeneral">一般設定</option>
    <option value="badges" data-i18n="categoryBadges">バッジ</option>
    <option value="serverTag" data-i18n="categoryServerTag">サーバータグ</option>
    <option value="profile" data-i18n="categoryProfile">プロフィール</option>
  </select>
  <section class="settings-panel" data-category="general">
  <div class="settings-row"><span data-i18n="language">言語</span><select id="languageSelect" aria-label="Language">
    <option value="ja">日本語</option><option value="en">English</option><option value="ko">한국어</option><option value="zh-CN">简体中文</option><option value="zh-TW">繁體中文</option><option value="fr">Français</option><option value="de">Deutsch</option><option value="es">Español</option><option value="pt">Português</option><option value="ru">Русский</option>
  </select></div>
  <div class="settings-row"><span data-i18n="staffMode">スタッフモード</span><label class="switch"><input id="staffModeToggle" type="checkbox" checked><span class="slider"></span></label></div>
  </section>
  <section class="settings-panel" data-category="badges" hidden>
  <div class="settings-row"><span data-i18n="override">バッジを上書き</span><label class="switch"><input id="overrideToggle" type="checkbox" checked><span class="slider"></span></label></div>
  <div id="enabledBadgeOrder" aria-label="有効なバッジの表示順" title="ドラッグして表示順を変更"></div>
  <div id="badgeList"></div>
  </section>
  <section class="settings-panel" data-category="serverTag" hidden>
  <div class="server-tag-settings">
    <div class="settings-row"><span data-i18n="serverTagToggle">サーバータグを上書き</span><label class="switch"><input id="serverTagToggle" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="serverTagBadge">サーバータグのバッジ</span><select id="serverTagBadgeSelect"></select></label>
    <label><span data-i18n="serverTagText">サーバータグの文字</span><input id="serverTagTextInput" type="text" data-i18n-placeholder="serverTagPlaceholder" placeholder="任意の文字"></label>
  </div>
  </section>
  <section class="settings-panel profile-settings" data-category="profile" hidden>
    <div class="settings-row"><span data-i18n="pronounsEnabled">代名詞を上書き</span><label class="switch"><input id="pronounsEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="pronounsText">代名詞</span><input id="pronounsText" type="text" maxlength="40" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></label>
    <div class="settings-row"><span data-i18n="usernameEnabled">ユーザー名を上書き</span><label class="switch"><input id="usernameEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="usernameText">ユーザー名</span><input id="usernameText" type="text" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></label>
    <div class="settings-row"><span data-i18n="bioEnabled">自己紹介を上書き</span><label class="switch"><input id="bioEnabled" type="checkbox"><span class="slider"></span></label></div>
    <label><span data-i18n="bioText">自己紹介</span><textarea id="bioText" data-i18n-placeholder="profilePlaceholder" placeholder="任意の文字"></textarea></label>
  </section>
  <script src="popup.js"></script>
  <p data-i18n="credit">Made by 清冰みらい</p>
</body>
</html>
